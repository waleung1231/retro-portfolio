<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emma's Desk</title>
  <meta name="description" content="A Y2K desk you can poke around in: open the CD player, flip open the phone, dive into the computer.">
  <link rel="icon" href="assets/deck/pixel-heart.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/desk.bundle.css">
  <link rel="stylesheet" href="css/desk.css">
</head>
<body>
  <div id="defs"></div>

  <header class="menubar">
    <span class="logo">✿ emma's desk</span>
    <nav id="menu" aria-label="Pages"></nav>
    <span class="grow"></span>
    <button id="lampBtn" title="Lamp on / off" aria-label="Toggle the desk lamp" aria-pressed="false">💡</button>
    <button id="soundBtn" title="Sound on / off" aria-label="Sound"></button>
    <time id="clock"></time>
  </header>

  <main class="viewport" id="viewport">
    <div id="sizer">
      <div id="cam">
        <div id="stage" class="stage" aria-label="My desk. Click things to explore."></div>
      </div>
    </div>
  </main>

  <p class="hint" id="hint">click things on my desk ✿ the computer, CD player, notebook &amp; phone open up</p>

  <div class="loader" id="loader">
    <div class="loader-win">
      <div class="titlebar"><i></i><b>desk.exe</b><i></i></div>
      <div class="loader-body">
        <div class="loader-text" id="loaderText"></div>
        <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
      </div>
    </div>
  </div>

  <div id="sparks" class="sparks" aria-hidden="true"></div>

  <noscript><p style="padding:20px;font-family:monospace">This portfolio needs JavaScript turned on.</p></noscript>

  <script src="vendor/desk.bundle.js"></script>
  <script src="js/desk/content.js"></script>
  <script src="js/desk/sound.js"></script>
  <script src="js/desk/art.js"></script>
  <script src="js/desk/scene.js"></script>
  <script src="js/desk/pages.js"></script>
  <script src="js/desk/main.js"></script>
</body>
</html>
