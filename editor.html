<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Editor</title>
  <link rel="icon" href="assets/deck/pixel-heart.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">✿ <input id="projectName" class="name-input" aria-label="Project name" spellcheck="false"></div>
    <nav class="pages" id="pageTabs" aria-label="Pages"></nav>
    <button class="tab add" id="addPage" title="Add a page">＋ page</button>
    <div class="spacer"></div>
    <button id="undoBtn" title="Undo (Ctrl/⌘ Z)">↶ undo</button>
    <button id="redoBtn" title="Redo (Ctrl/⌘ Shift Z)">↷ redo</button>
    <button id="previewBtn" title="Open the site in a new tab">▶ preview</button>
    <button id="exportBtn" title="Download the whole project as one file">⇩ export</button>
    <button id="importBtn" title="Open a project file">⇧ import</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span class="save-state" id="saveState">saved</span>
  </header>

  <main class="workspace">
    <aside class="panel library">
      <div class="panel-head">
        <h2>assets</h2>
        <button id="uploadBtn" class="small">＋ upload</button>
        <input type="file" id="uploadFile" accept="image/png,image/webp,image/gif,image/svg+xml,image/jpeg" multiple hidden>
      </div>
      <div class="filters" id="filters">
        <button data-kind="all" class="on">all</button>
        <button data-kind="mine">mine</button>
        <button data-kind="retro">retro</button>
        <button data-kind="desk">desk</button>
        <button data-kind="element">doodle</button>
        <button data-kind="pixel">pixel</button>
        <button data-kind="background">backgrounds</button>
      </div>
      <p class="hint" id="libraryHint">Click to add to the page. Backgrounds fill the page.</p>
      <div class="asset-grid" id="assetGrid"></div>
      <button id="addText" class="wide">T  add text</button>
    </aside>

    <section class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <div class="elements" id="elements"></div>
        <div class="selection" id="selection" hidden>
          <div class="rot-stem"></div>
          <div class="handle rot" data-h="rot" title="Rotate (Shift snaps)"></div>
          <div class="handle nw" data-h="nw"></div><div class="handle ne" data-h="ne"></div>
          <div class="handle sw" data-h="sw"></div><div class="handle se" data-h="se"></div>
        </div>
      </div>
      <div class="drop-note" id="dropNote">drop images to upload</div>
    </section>

    <aside class="panel side">
      <div class="panel-head"><h2>layers</h2><span class="hint">top = front</span></div>
      <ol class="layers" id="layers"></ol>
      <div class="inspector" id="inspector"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/deck/manifest.js"></script>
  <script src="js/store.js"></script>
  <script src="js/starter.js"></script>
  <script src="js/render.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
